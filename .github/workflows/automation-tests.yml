name: Opencart Automation Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tags to run (e.g., @sanity, @regression)'
        required: false
        default: '@sanity'

permissions:
  contents: write
  pages: write
  id-token: write

env:
  JAVA_VERSION: '24'
  MAVEN_VERSION: '3.8.1'

jobs:
  build-and-test:
    name: Build and Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox]
      fail-fast: false
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install Chrome browser
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: latest

      - name: Install Firefox browser
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@latest
        with:
          firefox-version: latest

      - name: Install ChromeDriver
        if: matrix.browser == 'chrome'
        uses: nanasess/setup-chromedriver@master
        with:
          chromedriver-version: '131.0.6778.264'

      - name: Install GeckoDriver
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-geckodriver@latest
        with:
          geckodriver-version: latest

      - name: Build Project
        run: mvn clean compile -DskipTests=true
        continue-on-error: false

      - name: Run Tests - ${{ matrix.browser }}
        run: |
          export BROWSER=${{ matrix.browser }}
          export EXEC_ENV=local
          mvn test -Dtest=ParallelRunner
        continue-on-error: true

      - name: Generate Allure Report
        if: always()
        run: |
          mvn io.qameta.allure:allure-maven:report
        continue-on-error: true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: |
            target/
            reports/
            logs/
          retention-days: 30

      - name: Publish Allure Report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && matrix.browser == 'chrome'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/allure-maven-plugin
          destination_dir: allure-report
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Comment PR with Test Results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const browser = '${{ matrix.browser }}';
            
            let comment = `## 🧪 Test Results - ${browser.toUpperCase()}\n\n`;
            
            // Check if tests passed
            const testPassed = ${{ job.status == 'success' }};
            comment += testPassed ? '✅ Tests Passed\n' : '❌ Tests Failed\n';
            
            comment += `\n- **Browser**: ${browser}\n`;
            comment += `- **Execution**: Local\n`;
            comment += `- **Status**: ${testPassed ? 'SUCCESS' : 'FAILURE'}\n`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
        continue-on-error: true

  test-report:
    name: Consolidate Test Reports
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-test-results

      - name: Display Test Summary
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All test results have been collected and are available in the artifacts." >> $GITHUB_STEP_SUMMARY
          ls -la all-test-results/

      - name: Create Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-combined
          path: all-test-results/
          retention-days: 30

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()
    
    steps:
      - name: Check Test Status
        id: test_status
        run: |
          if [ "${{ needs.build-and-test.result }}" == "success" ]; then
            echo "status=✅ PASSED" >> $GITHUB_OUTPUT
            echo "color=28a745" >> $GITHUB_OUTPUT
          else
            echo "status=❌ FAILED" >> $GITHUB_OUTPUT
            echo "color=dc3545" >> $GITHUB_OUTPUT
          fi

      - name: Post Results Summary
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ steps.test_status.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
